<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartGastro.ai | Kasse, Website und KI für Restaurants</title>
    <meta name="description" content="Kasse, Website, digitale Speisekarte und KI für Restaurants aus einer Hand. Von Thomas Ballinari, gelerntem Koch, St. Gallen. Erstgespräch kostenlos." />
    <meta name="theme-color" content="#0B5D33" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://smartgastro.ai/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:site_name" content="SmartGastro.ai" />
    <meta property="og:title" content="SmartGastro.ai | Kasse, Website und KI für Restaurants" />
    <meta property="og:description" content="Kasse, Website, digitale Speisekarte und KI für Restaurants aus einer Hand. Von Thomas Ballinari, gelerntem Koch, St. Gallen. Erstgespräch kostenlos." />
    <meta property="og:url" content="https://smartgastro.ai/" />
    <meta property="og:image" content="https://smartgastro.ai/assets/img/v2/og-smartgastro.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "SmartGastro.ai",
        "url": "https://smartgastro.ai/",
        "image": "https://smartgastro.ai/assets/img/v2/og-smartgastro.jpg",
        "email": "hello@smartgastro.ai",
        "founder": { "@type": "Person", "name": "Thomas Ballinari", "jobTitle": "Gründer, Koch und KI-Spezialist" },
        "address": { "@type": "PostalAddress", "streetAddress": "Volksbadstrasse 17a", "addressLocality": "St. Gallen", "postalCode": "9000", "addressCountry": "CH" },
        "areaServed": "CH",
        "knowsAbout": ["Kassensystem", "Restaurant-Website", "Webdesign", "Digitale Speisekarte", "QR-Speisekarte", "Order & Pay", "Kassensysteme", "KI in der Gastronomie", "Food Waste"]
      }
    </script>
  </head>
  <body>
    <!-- Statische Kopie des Kontaktformulars, damit Netlify Forms es beim Deploy erkennt -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="email" name="email" /><input type="text" name="firma" />
      <input type="text" name="anliegen" /><textarea name="nachricht"></textarea><input type="checkbox" name="privacy" /><input name="bot-field" />
      <input type="tel" name="telefon" /><input type="text" name="wunschtermin" /><input type="radio" name="termin" value="Vor Ort im Betrieb" />
    </form>
    <div id="root"></div>
    <noscript>
      <p>SmartGastro.ai: Kassensystem, Website, digitale Speisekarten, Order &amp; Pay und KI-Lösungen für die Schweizer Gastronomie. Kontakt: hello@smartgastro.ai</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
